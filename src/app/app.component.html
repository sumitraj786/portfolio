<div class="relative w-full min-h-screen bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 overflow-x-hidden">

  <!-- Top Navigation -->
  <nav class="fixed top-0 left-0 w-full bg-white/80 dark:bg-gray-900/80 backdrop-blur-md shadow-sm z-50 transition-all duration-300">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex-shrink-0 font-bold text-xl tracking-tight text-cyan-600 dark:text-cyan-400">
          Sumit Raj
        </div>
        <div class="hidden md:block">
          <div class="ml-10 flex items-baseline space-x-6">
            <a href="#hero" class="hover:text-cyan-500 transition-colors px-3 py-2 rounded-md text-sm font-medium" [class.text-cyan-600]="activeSection === 'hero'">Home</a>
            <a href="#about" class="hover:text-cyan-500 transition-colors px-3 py-2 rounded-md text-sm font-medium" [class.text-cyan-600]="activeSection === 'about'">About</a>
            <a href="#projects" class="hover:text-cyan-500 transition-colors px-3 py-2 rounded-md text-sm font-medium" [class.text-cyan-600]="activeSection === 'projects'">Projects</a>
            <a href="#experience" class="hover:text-cyan-500 transition-colors px-3 py-2 rounded-md text-sm font-medium" [class.text-cyan-600]="activeSection === 'experience'">Experience</a>
            <a href="#contact" class="hover:text-cyan-500 transition-colors px-3 py-2 rounded-md text-sm font-medium" [class.text-cyan-600]="activeSection === 'contact'">Contact</a>
          </div>
        </div>
        <!-- Mobile menu button (can be extended with JS toggle if needed, keeping simple for now) -->
        <div class="md:hidden flex items-center space-x-2 text-sm">
           <a href="#about"><i class="fa-solid fa-user"></i></a>
           <a href="#projects"><i class="fa-solid fa-code-branch"></i></a>
           <a href="#experience"><i class="fa-solid fa-briefcase"></i></a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <div class="pt-20 pb-10 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <section id="hero" class="min-h-[90vh] flex items-center py-10"><app-hero class="w-full"></app-hero></section>
    
    <div class="space-y-32">
      <section id="about" class="scroll-mt-24"><app-about></app-about></section>
      <section id="projects" class="scroll-mt-24"><app-projects></app-projects></section>
      <section id="experience" class="scroll-mt-24"><app-experience></app-experience></section>
      <section id="contact" class="scroll-mt-24"><app-contact></app-contact></section>
    </div>

    <footer class="mt-20 pt-8 border-t border-gray-200 dark:border-gray-800 text-center text-sm text-gray-500 dark:text-gray-400">
      <p>© {{ currentYear }} Sumit Raj. Built with Passion and Precision.</p>
    </footer>
  </div>

</div>
