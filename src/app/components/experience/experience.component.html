<div class="mb-12">
  <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-8 flex items-center gap-3">
    <i class="fa-solid fa-briefcase text-cyan-500"></i> Experience
  </h2>

  <div class="space-y-8 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-300 dark:before:via-slate-700 before:to-transparent">
    
    <!-- Timeline Item -->
    <div *ngFor="let e of exps; let i = index" class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
      
      <!-- Icon -->
      <div class="flex items-center justify-center w-10 h-10 rounded-full border-4 border-white dark:border-slate-900 bg-cyan-100 dark:bg-cyan-900 text-cyan-500 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
        <i class="fa-solid fa-star text-xs"></i>
      </div>
      
      <!-- Card -->
      <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] card hover:shadow-md transition-shadow relative">
        <div class="flex items-center justify-between mb-2">
          <div>
            <h3 class="font-bold text-slate-900 dark:text-white text-lg">{{ e.role }}</h3>
            <div class="text-cyan-600 dark:text-cyan-400 font-medium text-sm">{{ e.company }}</div>
          </div>
          <img [src]="e.logo" [alt]="e.company" class="w-10 h-10 object-contain rounded-md bg-white p-1 border border-slate-100 dark:border-slate-700" />
        </div>
        <div class="text-xs text-slate-500 dark:text-slate-400 mb-4 font-mono">
          <i class="fa-regular fa-calendar mr-1"></i> {{ e.period }} &nbsp;|&nbsp; <i class="fa-solid fa-location-dot mr-1"></i> {{ e.location }}
        </div>
        
        <ul class="space-y-2 list-none">
          <li *ngFor="let b of e.bullets" class="text-sm text-slate-600 dark:text-slate-300 flex gap-2">
            <i class="fa-solid fa-circle-check text-cyan-500 mt-0.5 text-xs"></i>
            <span>{{ b }}</span>
          </li>
        </ul>
      </div>
      
    </div>

  </div>
</div>
