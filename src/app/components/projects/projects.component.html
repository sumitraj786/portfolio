<div class="mb-12">
  <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-8 flex items-center gap-3">
    <i class="fa-solid fa-code-branch text-cyan-500"></i> Projects
  </h2>

  <div class="grid md:grid-cols-2 gap-8">
    <div *ngFor="let p of projects" class="card flex flex-col h-full hover:shadow-lg hover:-translate-y-1 transition-all">
      <div class="flex-grow">
        <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3">
          {{ p.title }}
        </h3>
        
        <ul class="space-y-2 list-none mb-6">
          <li *ngFor="let b of p.bullets" class="text-sm text-slate-600 dark:text-slate-300 flex items-start gap-2">
            <i class="fa-solid fa-circle-check text-cyan-500 mt-1 text-xs shrink-0"></i>
            <span>{{ b }}</span>
          </li>
        </ul>
      </div>

      <div class="mt-auto">
        <!-- Tech stack -->
        <div class="flex flex-wrap gap-2 mb-4">
          <span *ngFor="let t of p.tech" class="tech-pill">{{ t }}</span>
        </div>

        <!-- Links -->
        <div class="flex items-center gap-4 pt-4 border-t border-slate-100 dark:border-slate-700">
          <a *ngIf="p.url" [href]="p.url" target="_blank" rel="noopener noreferrer" class="icon-link font-medium text-sm">
            <i class="fa-brands fa-github text-lg"></i> View Source
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
